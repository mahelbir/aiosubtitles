packages:
  - 'apps/*'
  - 'packages/*'

allowBuilds:
  '@parcel/watcher': false
  cpu-features: false
  msw: false
  protobufjs: false
  sharp: true
  ssh2: false
  unrs-resolver: true

minimumReleaseAgeExclude:
  - lucide-react@1.67.0
  - melperjs@17.4.0
  - '@mahelbir/settings@6.0.0'
  - '@fastify/swagger-ui@6.1.3'

skills:
  dirs:
    - .agents/skills
